name: Registrar aplicación de Obadías en documento maestro

on:
  push:
    branches:
      - fase-d/validacion-obadias-aplicada
    paths:
      - ".github/workflows/register-obadiah-applied-master.yml"

permissions:
  contents: write

jobs:
  update-master:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fase-d/validacion-obadias-aplicada
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Actualizar documento maestro
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('__VIDA_INTERNACIONAL.md')
          text = path.read_text(encoding='utf-8')
          marker = "El Bloque 4 continúa activo. El siguiente recorrido es convertir el borrador validado en migración activa, aplicarla de forma controlada a Supabase y realizar una auditoría posterior independiente de conteos, permisos, hashes y recuperación desde el servidor. No se ampliará a otros libros hasta validar Obadías en la aplicación."
          replacement = """### Avance confirmado del Bloque 4 — Obadías aplicado a Supabase

La migración activa y el payload canónico de Obadías fueron aplicados de forma controlada y auditados después de la escritura.

Resultado:

- textos de versículo: 21;
- palabras visibles: 291;
- ocurrencias morfológicas: 434;
- identificadores léxicos usados: 184;
- variantes estructuradas: 3;
- lotes: 1;
- hashes inválidos: 0;
- campos editoriales españoles inventados: 0;
- segunda ejecución idempotente sin duplicados.

Seguridad:

- `anon` sin `EXECUTE`;
- `authenticated` sin `EXECUTE`;
- `service_role` con `EXECUTE`;
- RLS y políticas existentes no fueron debilitadas.

Evidencia:

- PR #67;
- commit `8705ffd9044bacec0d15495ca0b82c186cf53455`;
- migración `importador_payload_tahot_obadias`;
- `docs/FASE_D_APLICACION_OBADIAS_SUPABASE.md`.

El Bloque 4 continúa activo. El siguiente recorrido es validar la recuperación desde el servidor y la visualización de Obadías en Biblia → Estudio y Estudio Profundo. No se ampliará a otros libros hasta completar esa validación."""
          if replacement in text:
              raise SystemExit(0)
          if text.count(marker) != 1:
              raise SystemExit('No se encontró un único marcador pendiente de Obadías')
          path.write_text(text.replace(marker, replacement, 1), encoding='utf-8')
          PY
          git diff --check

      - name: Versionar actualización
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "vida-internacional-bot"
          git config user.email "actions@users.noreply.github.com"
          git add __VIDA_INTERNACIONAL.md
          git commit -m "docs(fase-d): registrar Obadías aplicado a Supabase"
          git push origin HEAD:fase-d/validacion-obadias-aplicada