name: Validar fuentes textuales del Antiguo Testamento

on:
  push:
    branches:
      - fase-d/corpus-textual-antiguo-testamento
    paths:
      - "scripts/stepbible/inspect_ot_sources.py"
      - "scripts/stepbible/inspect_ot_row_shapes.py"
      - ".github/workflows/validate-stepbible-ot-sources.yml"
      - "docs/FASE_D_FUENTES_TEXTUALES_AT.md"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/stepbible/inspect_ot_sources.py"
      - "scripts/stepbible/inspect_ot_row_shapes.py"
      - ".github/workflows/validate-stepbible-ot-sources.yml"
      - "docs/FASE_D_FUENTES_TEXTUALES_AT.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar auto-test
        run: python scripts/stepbible/inspect_ot_sources.py --self-test

      - name: Descargar e inspeccionar TAHOT
        run: python scripts/stepbible/inspect_ot_sources.py --output artifacts/stepbible-ot-sources

      - name: Clasificar filas continuadas
        working-directory: scripts/stepbible
        run: python inspect_ot_row_shapes.py --output ../../artifacts/stepbible-ot-sources --samples 10

      - name: Mostrar resúmenes
        run: |
          cat artifacts/stepbible-ot-sources/validation.md
          printf '\n'
          cat artifacts/stepbible-ot-sources/row-shapes.md

      - uses: actions/upload-artifact@v4
        with:
          name: stepbible-ot-source-inspection
          path: artifacts/stepbible-ot-sources
          if-no-files-found: error
          retention-days: 14
