name: Internal Pastoral Image And Hebrew Gloss

on:
  push:
    branches:
      - automation/pastoral-hebrew-gloss-inspect

permissions:
  contents: write

jobs:
  apply-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: agent/centro-pastoral-reorganizacion
          fetch-depth: 0

      - name: Verify target head
        run: test "$(git rev-parse HEAD)" = "527767f7e42a37712110b932c469bf11adece11c"

      - name: Checkout helper script
        uses: actions/checkout@v6
        with:
          ref: automation/pastoral-hebrew-gloss-inspect
          path: _helper
          sparse-checkout: .github/scripts/pastoral_image_hebrew_gloss_patch.py

      - name: Download UBS Hebrew Spanish dictionary
        run: curl -L --fail --retry 3 'https://raw.githubusercontent.com/ubsicap/ubs-open-license/main/dictionaries/hebrew/JSON/UBSHebrewDic-v0.9.2-es.JSON' -o /tmp/ubs-hebrew-es.json

      - name: Apply exact changes and build glossary
        run: python _helper/.github/scripts/pastoral_image_hebrew_gloss_patch.py

      - name: Verify diff scope
        run: |
          git diff --check
          git diff --stat
          actual="$(git diff --name-only | sort | tr '\n' ' ')"
          expected="components/pastoral/PastoralVersePicker.tsx components/pastoral/PastoralVisualWorkspaceV4.tsx public/data/ubs-hebrew-es-glosses.json "
          test "$actual" = "$expected"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run critical regressions
        run: npm run test:regression

      - name: Generate ephemeral VAPID keys
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const webpush = require('web-push')
          const keys = webpush.generateVAPIDKeys()
          fs.appendFileSync(process.env.GITHUB_ENV, `VAPID_SUBJECT=mailto:ci@example.invalid\n`)
          fs.appendFileSync(process.env.GITHUB_ENV, `NEXT_PUBLIC_VAPID_PUBLIC_KEY=${keys.publicKey}\n`)
          fs.appendFileSync(process.env.GITHUB_ENV, `VAPID_PRIVATE_KEY=${keys.privateKey}\n`)
          NODE

      - name: Build
        run: npm run build
        env:
          CI: 'true'

      - name: Publish clean target commit
        run: |
          rm -rf _helper
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/pastoral/PastoralVisualWorkspaceV4.tsx components/pastoral/PastoralVersePicker.tsx public/data/ubs-hebrew-es-glosses.json
          git commit -m 'feat(pastoral): clarify image modes and Hebrew word meanings'
          git push origin HEAD:agent/centro-pastoral-reorganizacion
