name: Materializar aplicación Roma temporal

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - scripts/fase_d/register_rome_application_master.py

permissions:
  contents: write

jobs:
  materializar:
    if: github.head_ref == 'agent/fase-d-registrar-aplicacion-roma-final'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fase-d-registrar-aplicacion-roma-final
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Actualizar documento maestro
        run: python3 scripts/fase_d/register_rome_application_master.py
      - name: Confirmar registro único
        run: test "$(grep -c '20260803151613' __VIDA_INTERNACIONAL.md)" -eq 1
      - name: Retirar auxiliares y publicar rama final
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add __VIDA_INTERNACIONAL.md
          git rm scripts/fase_d/register_rome_application_master.py
          git rm .github/workflows/materializar-aplicacion-roma-temporal.yml
          git diff --cached --check
          git commit -m 'docs(fase-d): registrar aplicación del esquema de Roma'
          git push
