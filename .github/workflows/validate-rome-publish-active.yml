name: Validar migración activa de Roma

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20260803170000_publish_rome_pilot_v1.sql'
      - 'supabase/recovery/20260803170000_unpublish_rome_pilot_v1.sql'
      - 'docs/sql-candidates/FASE_D_BLOQUE_5_ROMA_PUBLISH_CANDIDATE.sql'
      - 'docs/sql-candidates/FASE_D_BLOQUE_5_ROMA_UNPUBLISH_RECOVERY_CANDIDATE.sql'
      - 'scripts/fase_d/validate_rome_publish_candidate.sql'
      - '.github/workflows/validate-rome-publish-active.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vida_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vida_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Confirmar equivalencia con candidatos validados
        run: |
          diff -u <(tail -n +5 docs/sql-candidates/FASE_D_BLOQUE_5_ROMA_PUBLISH_CANDIDATE.sql) <(tail -n +5 supabase/migrations/20260803170000_publish_rome_pilot_v1.sql)
          diff -u <(tail -n +5 docs/sql-candidates/FASE_D_BLOQUE_5_ROMA_UNPUBLISH_RECOVERY_CANDIDATE.sql) <(tail -n +5 supabase/recovery/20260803170000_unpublish_rome_pilot_v1.sql)
          grep -q 'NO APLICAR SIN AUTORIZACIÓN POSTERIOR' supabase/migrations/20260803170000_publish_rome_pilot_v1.sql
          test ! -e supabase/migrations/20260803170000_unpublish_rome_pilot_v1.sql
      - name: Repetir matriz PostgreSQL 17
        run: psql -h 127.0.0.1 -U postgres -d vida_test -f scripts/fase_d/validate_rome_publish_candidate.sql
      - name: Verificar formato
        run: git diff --check
