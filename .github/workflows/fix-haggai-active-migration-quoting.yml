name: Corregir cita SQL de Hageo

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/stepbible/fix_haggai_active_migration_quoting.py"
      - ".github/workflows/fix-haggai-active-migration-quoting.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Corregir migración y prueba
        run: python scripts/stepbible/fix_haggai_active_migration_quoting.py
      - name: Versionar corrección
        run: |
          if git diff --quiet -- \
            supabase/migrations/20260803023000_generalizar_importador_payload_tahot_hageo.sql \
            scripts/stepbible/test_haggai_active_migration.py; then
            echo "Sin cambios pendientes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            supabase/migrations/20260803023000_generalizar_importador_payload_tahot_hageo.sql \
            scripts/stepbible/test_haggai_active_migration.py
          git commit -m "fix(fase-d): corregir cita SQL de migración Hageo"
          git push
