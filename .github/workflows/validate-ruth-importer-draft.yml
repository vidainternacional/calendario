name: Validar importador transaccional de Rut

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/stepbible/build_ruth_importer_draft.py"
      - "scripts/stepbible/test_ruth_importer_draft.py"
      - "supabase/migration-drafts/20260803003000_importador_payload_tahot_rut.sql"
      - ".github/workflows/validate-ruth-importer-draft.yml"
      - "docs/FASE_D_IMPORTADOR_TAHOT_RUT.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vida_importer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vida_importer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar cliente PostgreSQL
        run: python -m pip install --disable-pip-version-check "psycopg[binary]==3.2.9"

      - name: Ejecutar auto-tests
        run: |
          python scripts/stepbible/tahot_schema.py --self-test
          python scripts/stepbible/extract_ot_book.py --self-test
          python scripts/stepbible/tahot_components.py
          python scripts/stepbible/build_tahot_import_payload.py --self-test

      - name: Generar paquete y payload de Rut
        run: |
          python scripts/stepbible/extract_ot_book.py \
            --book Rut \
            --output artifacts/ruth-importer
          python scripts/stepbible/build_tahot_import_payload.py \
            artifacts/ruth-importer/rut.json.gz \
            --policy scripts/stepbible/ruth_affix_lemma_policy.json \
            --output artifacts/ruth-importer/import-payload.json
          test "$(sha256sum artifacts/ruth-importer/import-payload.json | cut -d' ' -f1)" = \
            "454d57e805cd55eaf59d1d7635eb2fe913858ff03f293b18d0db315222178913"

      - name: Generar borrador SQL
        run: |
          python scripts/stepbible/build_ruth_importer_draft.py
          git diff --check
          test -f supabase/migration-drafts/20260803003000_importador_payload_tahot_rut.sql

      - name: Validar transacción, rollback e idempotencia
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vida_importer_test
        run: |
          python scripts/stepbible/test_ruth_importer_draft.py \
            --dsn "$TEST_DATABASE_URL" \
            --fixture tests/sql/obadiah_textual_schema_fixture.sql \
            --draft supabase/migration-drafts/20260803003000_importador_payload_tahot_rut.sql \
            --package artifacts/ruth-importer/rut.json.gz \
            --payload artifacts/ruth-importer/import-payload.json \
            | tee artifacts/ruth-importer/importer-validation.json

      - uses: actions/upload-artifact@v4
        with:
          name: stepbible-ruth-importer-validation
          path: |
            supabase/migration-drafts/20260803003000_importador_payload_tahot_rut.sql
            artifacts/ruth-importer/manifest.json
            artifacts/ruth-importer/importer-validation.json
          if-no-files-found: error
          retention-days: 14
