name: Validar migración activa TAHOT de Hageo

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/migrations/20260803022000_generalizar_importador_payload_tahot_hageo.sql"
      - ".github/workflows/validate-stepbible-haggai-active-migration.yml"
      - "docs/FASE_D_APLICACION_HAGEO_SUPABASE.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vida_haggai_active_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vida_haggai_active_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar cliente PostgreSQL
        run: python -m pip install --disable-pip-version-check "psycopg[binary]==3.2.9"

      - name: Ejecutar auto-tests
        run: |
          python scripts/stepbible/tahot_schema.py --self-test
          python scripts/stepbible/extract_ot_book.py --self-test
          python scripts/stepbible/tahot_components.py
          python scripts/stepbible/build_tahot_import_payload.py --self-test
          python scripts/stepbible/audit_haggai_import_payload.py --self-test

      - name: Generar paquete y payload fijados
        run: |
          python scripts/stepbible/extract_ot_book.py \
            --book Hag \
            --output artifacts/haggai-active
          test "$(sha256sum artifacts/haggai-active/hag.json.gz | cut -d' ' -f1)" = \
            "bc8e1caebce9a2e55d34b3be4770f3591e430b3aa217208324dee1bdbdd54e38"
          python scripts/stepbible/build_tahot_import_payload.py \
            artifacts/haggai-active/hag.json.gz \
            --policy scripts/stepbible/haggai_affix_lemma_policy.json \
            --output artifacts/haggai-active/import-payload.json
          test "$(sha256sum artifacts/haggai-active/import-payload.json | cut -d' ' -f1)" = \
            "c24d50fbbe01ecb47ec5a818c8a0f8cbdebae1451f2c9cd2b446234f02516ec6"

      - name: Preparar copia de prueba del SQL activo
        run: |
          ACTIVE=supabase/migrations/20260803022000_generalizar_importador_payload_tahot_hageo.sql
          test -f "$ACTIVE"
          grep -q -- "-- MIGRACIÓN ACTIVA" "$ACTIVE"
          ! grep -q -- "-- BORRADOR NO ACTIVO" "$ACTIVE"
          mkdir -p artifacts/migration-drafts
          sed \
            -e 's/-- MIGRACIÓN ACTIVA\. Amplía el importador TAHOT validado para aceptar exactamente Hageo\./-- BORRADOR NO ACTIVO. Amplía el importador validado para aceptar exactamente Hageo./' \
            -e 's/-- Verifica la huella de la función OBA\/RUT y conserva ejecución exclusiva de service_role\./-- No aplicar a Supabase hasta completar la validación externa y registrar el resultado./' \
            "$ACTIVE" > artifacts/migration-drafts/haggai-active-as-draft.sql

      - name: Validar rechazo, rollback e idempotencia
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vida_haggai_active_test
        run: |
          python scripts/stepbible/test_haggai_importer_draft.py \
            --dsn "$TEST_DATABASE_URL" \
            --fixture tests/sql/obadiah_textual_schema_fixture.sql \
            --base-migration supabase/migrations/20260802232000_importador_payload_tahot_obadias.sql \
            --ruth-migration supabase/migrations/20260803011000_generalizar_importador_payload_tahot_rut.sql \
            --draft artifacts/migration-drafts/haggai-active-as-draft.sql \
            --package artifacts/haggai-active/hag.json.gz \
            --payload artifacts/haggai-active/import-payload.json \
            | tee artifacts/haggai-active/active-migration-validation.json
          git diff --check

      - uses: actions/upload-artifact@v4
        with:
          name: stepbible-haggai-active-migration-validation
          path: |
            supabase/migrations/20260803022000_generalizar_importador_payload_tahot_hageo.sql
            artifacts/haggai-active/manifest.json
            artifacts/haggai-active/active-migration-validation.json
          if-no-files-found: error
          retention-days: 14
