name: Validar esquema observado de TAHOT

on:
  push:
    branches:
      - fase-d/esquema-columnas-tahot
    paths:
      - "scripts/stepbible/inspect_ot_schema.py"
      - "scripts/stepbible/inspect_ot_sources.py"
      - ".github/workflows/validate-stepbible-ot-schema.yml"
      - "docs/FASE_D_ESQUEMA_TAHOT.md"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/stepbible/inspect_ot_schema.py"
      - "scripts/stepbible/inspect_ot_sources.py"
      - ".github/workflows/validate-stepbible-ot-schema.yml"
      - "docs/FASE_D_ESQUEMA_TAHOT.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar auto-test
        run: python scripts/stepbible/inspect_ot_schema.py --self-test

      - name: Inspeccionar encabezados y formas de fila
        run: python scripts/stepbible/inspect_ot_schema.py --output artifacts/stepbible-ot-schema --samples 5

      - name: Mostrar resumen
        run: cat artifacts/stepbible-ot-schema/schema-observation.md

      - uses: actions/upload-artifact@v4
        with:
          name: stepbible-ot-schema-observation
          path: artifacts/stepbible-ot-schema
          if-no-files-found: error
          retention-days: 14
