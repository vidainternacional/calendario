name: Record pastoral final validation checkpoint

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-master:
    if: "${{ github.event.head_commit.message == 'chore: stage pastoral master checkpoint update' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update VIDA master
        shell: python
        run: |
          from pathlib import Path
          p = Path('__VIDA_INTERNACIONAL.md')
          text = p.read_text()
          old = '11. Se preservan Deshacer/Rehacer, guardado, navegación, Biblia, imágenes, capas, Presentar y Congregación sin cambios de permisos ni Supabase/RLS.\n12. Checkpoint técnico aprobado del bloque: `67153b157c01c4043395a907719d82d967268b6a`; PR #287 permanece OPEN · DRAFT · sin merge.\n\n# Siguiente punto autorizado\n\n**Continuar exclusivamente con la prioridad actual del Centro Pastoral, incluyendo la reorganización y pulido del editor visual del PR #287. Preservar todas las decisiones visuales y funcionales ya aprobadas; no modificar geometría, límites, tamaños o comportamientos validados salvo instrucción explícita o bug reproducible. FASE I permanece diferida hasta que la aplicación quede terminada.**'
          new = '11. Se confirma persistencia real del Editor Pastoral: Guardar y autoguardado conservan páginas, textos, imágenes, capas, posiciones, opacidad, fusión, fondos y degradados lineales, radiales y cónicos. El estado de guardado se comunica únicamente mediante el check superior, sin toast de “Proyecto guardado”.\n12. Checkpoint técnico aprobado del bloque: `f3d54260f998e83c93440622df26ef34aa1f0052`; PR #287 permanece OPEN · DRAFT · sin merge.\n\n# Siguiente punto autorizado\n\n**Validación final funcional del Editor Visual del Centro Pastoral, incluyendo Presentar, Congregación y pantalla completa real. Preservar íntegramente todo lo aprobado y no reabrir herramientas ya validadas salvo bug reproducible.**'
          if old not in text:
            raise SystemExit('approved pastoral checkpoint target not found')
          p.write_text(text.replace(old, new, 1))
      - name: Verify exact diff
        run: git diff --check && git diff -- __VIDA_INTERNACIONAL.md
      - name: Commit approved master update and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/internal-record-pastoral-final-validation.yml
          git add __VIDA_INTERNACIONAL.md .github/workflows/internal-record-pastoral-final-validation.yml
          git commit -m "docs: record pastoral persistence approval"
          git push origin HEAD:main
