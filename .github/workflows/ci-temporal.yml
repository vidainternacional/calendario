name: CI temporal

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: read

concurrency:
  group: ci-temporal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Instalación, lint informativo y build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias reproducibles
        run: npm ci

      - name: Ejecutar lint informativo
        continue-on-error: true
        run: npm run lint

      - name: Compilar aplicación
        run: npm run build
        env:
          CI: 'true'
