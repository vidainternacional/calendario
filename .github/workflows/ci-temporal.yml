name: CI temporal

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: write

concurrency:
  group: ci-temporal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Instalación, lint informativo y build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materializar registro de aplicación Roma
        if: github.event_name == 'push' && github.ref_name == 'agent/fase-d-registrar-aplicacion-roma'
        run: |
          set -euo pipefail
          python3 scripts/fase_d/register_rome_pilot_application_master.py
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci-temporal.yml
          rm scripts/fase_d/register_rome_pilot_application_master.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "docs(fase-d): registrar aplicación auditada de Roma"
            git push
          fi

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias reproducibles
        run: npm ci

      - name: Ejecutar lint informativo
        continue-on-error: true
        run: npm run lint

      - name: Generar VAPID efímero para compilación
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const webpush = require('web-push')
          const keys = webpush.generateVAPIDKeys()
          fs.appendFileSync(process.env.GITHUB_ENV, `VAPID_SUBJECT=mailto:ci@example.invalid\n`)
          fs.appendFileSync(process.env.GITHUB_ENV, `NEXT_PUBLIC_VAPID_PUBLIC_KEY=${keys.publicKey}\n`)
          fs.appendFileSync(process.env.GITHUB_ENV, `VAPID_PRIVATE_KEY=${keys.privateKey}\n`)
          NODE

      - name: Compilar aplicación
        run: npm run build
        env:
          CI: 'true'
