name: CI temporal

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: read

concurrency:
  group: ci-temporal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Instalación, regresión, lint informativo y build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias reproducibles
        run: npm ci

      - name: Ejecutar regresiones críticas
        run: npm run test:regression

      - name: Ejecutar lint informativo
        continue-on-error: true
        run: npm run lint

      - name: Generar VAPID efímero para compilación
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const webpush = require('web-push')
          const keys = webpush.generateVAPIDKeys()
          fs.appendFileSync(process.env.GITHUB_ENV, `VAPID_SUBJECT=mailto:ci@example.invalid\n`)
          fs.appendFileSync(process.env.GITHUB_ENV, `NEXT_PUBLIC_VAPID_PUBLIC_KEY=${keys.publicKey}\n`)
          fs.appendFileSync(process.env.GITHUB_ENV, `VAPID_PRIVATE_KEY=${keys.privateKey}\n`)
          NODE

      - name: Compilar aplicación
        run: npm run build
        env:
          CI: 'true'

      - name: Medir presupuesto tipográfico pastoral
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const mediaDir = path.join('.next', 'static', 'media')
          const limite = 350 * 1024
          const archivos = fs.existsSync(mediaDir)
            ? fs.readdirSync(mediaDir).filter((nombre) => /\.woff2$/i.test(nombre)).sort()
            : []
          const detalle = archivos.map((nombre) => ({
            nombre,
            bytes: fs.statSync(path.join(mediaDir, nombre)).size,
          }))
          const total = detalle.reduce((suma, item) => suma + item.bytes, 0)
          for (const item of detalle) console.log(`${item.nombre}\t${item.bytes} bytes\t${(item.bytes / 1024).toFixed(2)} KB`)
          console.log(`PASTORAL_FONT_BUDGET_FILES=${detalle.length}`)
          console.log(`PASTORAL_FONT_BUDGET_BYTES=${total}`)
          console.log(`PASTORAL_FONT_BUDGET_KB=${(total / 1024).toFixed(2)}`)
          console.log(`PASTORAL_FONT_BUDGET_LIMIT_KB=350.00`)
          if (!detalle.length) {
            console.error('No se encontraron archivos WOFF2 generados por next/font.')
            process.exit(1)
          }
          if (total > limite) {
            console.error(`El paquete tipográfico supera el límite: ${(total / 1024).toFixed(2)} KB > 350.00 KB`)
            process.exit(1)
          }
          NODE
