name: CI temporal

on:
  push:
    branches:
      - agent/internal-pastoral-native-toolbar-refactor

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: agent/internal-pastoral-native-toolbar-refactor
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Aplicar refactor nativo
        run: |
          python scripts/internal_pastoral_native_toolbar_refactor.py
          git rm components/pastoral/PastoralTemplateRuntime.tsx

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build
        env:
          CI: 'true'

      - name: Publicar un solo head en la rama activa
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout 5170002685a02da9011953528f5af1fe291affc8 -- .github/workflows/ci-temporal.yml
          git rm .github/workflows/internal-pastoral-native-toolbar-refactor.yml
          git rm scripts/internal_pastoral_native_toolbar_refactor.py
          git add -A
          git commit -m "refactor(pastoral): make backgrounds a native editor tool"
          git push origin HEAD:refs/heads/agent/centro-pastoral-reorganizacion
          git push origin --delete agent/internal-pastoral-native-toolbar-refactor || true
