name: Habilitar paquete TAHOT de Nahúm

on:
  pull_request:
    branches:
      - main
    paths:
      - "docs/.enable-nahum-package"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enable:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Habilitar Nahúm
        run: |
          if [ ! -f scripts/stepbible/enable_nahum_package.py ]; then
            echo "Auxiliar retirado; no hay actualización pendiente"
            exit 0
          fi
          python scripts/stepbible/enable_nahum_package.py
          python scripts/stepbible/extract_ot_book.py --self-test
      - name: Versionar extractor
        run: |
          if git diff --quiet -- scripts/stepbible/extract_ot_book.py; then
            echo "Sin cambios pendientes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/stepbible/extract_ot_book.py
          git commit -m "feat(fase-d): habilitar paquete TAHOT de Nahúm"
          git push
