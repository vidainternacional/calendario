name: QA visual calendario iOS

on:
  workflow_dispatch:
  push:
    branches:
      - agent/calendario-fidelidad-visual-ios
    paths:
      - 'components/calendario/**'
      - 'components/layout/BottomNav.tsx'
      - 'app/material/qa-calendario/**'
      - '.github/workflows/calendar-visual-qa.yml'

permissions:
  contents: read

concurrency:
  group: calendar-visual-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capturas:
    name: Capturas iPhone claro y oscuro
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar aplicación
        run: npm ci

      - name: Preparar Playwright
        run: |
          npm install --no-save playwright@1.50.1
          npx playwright install --with-deps chromium

      - name: Generar VAPID efímero
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const webpush = require('web-push')
          const keys = webpush.generateVAPIDKeys()
          fs.appendFileSync(process.env.GITHUB_ENV, `VAPID_SUBJECT=mailto:qa@example.invalid\n`)
          fs.appendFileSync(process.env.GITHUB_ENV, `NEXT_PUBLIC_VAPID_PUBLIC_KEY=${keys.publicKey}\n`)
          fs.appendFileSync(process.env.GITHUB_ENV, `VAPID_PRIVATE_KEY=${keys.privateKey}\n`)
          NODE

      - name: Compilar aplicación
        run: npm run build
        env:
          CI: 'true'

      - name: Levantar aplicación
        run: |
          npm start -- -p 3000 > /tmp/vida-calendar.log 2>&1 &
          echo $! > /tmp/vida-calendar.pid
          for intento in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/material/qa-calendario > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vida-calendar.log
          exit 1

      - name: Capturar estados visuales
        run: |
          mkdir -p calendar-visual-qa
          node <<'NODE'
          const { chromium, devices } = require('playwright')
          const fs = require('node:fs')

          async function capture(scheme) {
            const browser = await chromium.launch({ headless: true })
            const context = await browser.newContext({
              ...devices['iPhone 13'],
              colorScheme: scheme,
              locale: 'es-SV',
              timezoneId: 'America/El_Salvador',
              reducedMotion: 'no-preference',
            })
            const page = await context.newPage()
            const prefix = scheme === 'dark' ? 'dark' : 'light'
            await page.goto('http://127.0.0.1:3000/material/qa-calendario', { waitUntil: 'networkidle' })
            await page.waitForTimeout(500)
            await page.screenshot({ path: `calendar-visual-qa/01-year-${prefix}.png`, fullPage: false })

            await page.getByRole('button', { name: /Abrir agosto 2026/i }).click()
            await page.waitForTimeout(750)
            await page.screenshot({ path: `calendar-visual-qa/02-month-${prefix}.png`, fullPage: false })

            await page.getByRole('button', { name: 'Cambiar vista' }).click()
            await page.waitForTimeout(250)
            await page.screenshot({ path: `calendar-visual-qa/03-menu-${prefix}.png`, fullPage: false })
            await page.getByRole('menuitemradio', { name: /Detalles/i }).click()
            await page.waitForTimeout(250)

            const dayFive = page.locator('button[aria-pressed]').filter({ hasText: /^5/ }).first()
            await dayFive.click()
            await page.waitForTimeout(520)
            await page.screenshot({ path: `calendar-visual-qa/04-day-panel-${prefix}.png`, fullPage: false })

            const report = {
              scheme,
              viewport: page.viewportSize(),
              bodyScrollWidth: await page.evaluate(() => document.body.scrollWidth),
              innerWidth: await page.evaluate(() => window.innerWidth),
              horizontalOverflow: await page.evaluate(() => document.documentElement.scrollWidth > window.innerWidth),
              buttonsBelowViewport: await page.evaluate(() => [...document.querySelectorAll('button')].filter((button) => button.getBoundingClientRect().top > window.innerHeight).length),
            }
            fs.writeFileSync(`calendar-visual-qa/report-${prefix}.json`, JSON.stringify(report, null, 2))
            await browser.close()
          }

          capture('dark').then(() => capture('light')).catch((error) => {
            console.error(error)
            process.exit(1)
          })
          NODE

      - name: Subir capturas
        uses: actions/upload-artifact@v4
        with:
          name: calendario-ios-visual-qa
          path: calendar-visual-qa
          if-no-files-found: error
          retention-days: 3

      - name: Mostrar log al fallar
        if: failure()
        run: cat /tmp/vida-calendar.log || true
