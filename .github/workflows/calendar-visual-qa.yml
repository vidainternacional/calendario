name: QA visual calendario iOS

on:
  workflow_dispatch:
  push:
    branches:
      - agent/calendario-fidelidad-visual-ios
    paths:
      - 'components/calendario/**'
      - 'components/layout/BottomNav.tsx'
      - 'app/material/qa-calendario/**'
      - '.github/workflows/calendar-visual-qa.yml'

permissions:
  contents: read

concurrency:
  group: calendar-visual-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capturas:
    name: Capturas iPhone 14 Pro Max claro y oscuro
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: qa-visual-anon-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar aplicación
        run: npm ci

      - name: Preparar Playwright WebKit
        run: |
          npm install --no-save playwright@1.50.1
          npx playwright install --with-deps webkit

      - name: Generar VAPID efímero
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const webpush = require('web-push')
          const keys = webpush.generateVAPIDKeys()
          fs.appendFileSync(process.env.GITHUB_ENV, `VAPID_SUBJECT=mailto:qa@example.invalid\n`)
          fs.appendFileSync(process.env.GITHUB_ENV, `NEXT_PUBLIC_VAPID_PUBLIC_KEY=${keys.publicKey}\n`)
          fs.appendFileSync(process.env.GITHUB_ENV, `VAPID_PRIVATE_KEY=${keys.privateKey}\n`)
          NODE

      - name: Compilar aplicación
        run: npm run build
        env:
          CI: 'true'

      - name: Levantar aplicación
        run: |
          npm start -- -p 3000 > /tmp/vida-calendar.log 2>&1 &
          echo $! > /tmp/vida-calendar.pid
          for intento in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/material/qa-calendario > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vida-calendar.log
          exit 1

      - name: Capturar estados visuales
        run: |
          mkdir -p calendar-visual-qa
          node <<'NODE'
          const { webkit } = require('playwright')
          const fs = require('node:fs')

          const viewport = { width: 430, height: 932 }
          const userAgent = 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1'

          async function capture(scheme) {
            const browser = await webkit.launch({ headless: true })
            const context = await browser.newContext({
              viewport,
              screen: viewport,
              deviceScaleFactor: 3,
              isMobile: true,
              hasTouch: true,
              userAgent,
              colorScheme: scheme,
              locale: 'es-SV',
              timezoneId: 'America/El_Salvador',
              reducedMotion: 'no-preference',
            })
            const page = await context.newPage()
            const prefix = scheme === 'dark' ? 'dark' : 'light'
            await page.goto('http://127.0.0.1:3000/material/qa-calendario', { waitUntil: 'networkidle' })
            await page.waitForTimeout(750)
            await page.screenshot({ path: `calendar-visual-qa/01-year-${prefix}.png`, fullPage: false })

            await page.getByRole('button', { name: /Abrir agosto 2026/i }).click()
            await page.getByRole('heading', { name: /agosto/i }).first().waitFor({ state: 'visible' })
            await page.waitForTimeout(1000)
            await page.screenshot({ path: `calendar-visual-qa/02-stacked-${prefix}.png`, fullPage: false })

            await page.getByRole('button', { name: 'Cambiar vista' }).click()
            await page.waitForTimeout(280)
            await page.screenshot({ path: `calendar-visual-qa/03-menu-${prefix}.png`, fullPage: false })

            await page.getByRole('menuitemradio', { name: /Compacta/i }).click()
            await page.waitForTimeout(320)
            await page.screenshot({ path: `calendar-visual-qa/04-compact-${prefix}.png`, fullPage: false })

            await page.getByRole('button', { name: 'Cambiar vista' }).click()
            await page.getByRole('menuitemradio', { name: /Detalles/i }).click()
            await page.waitForTimeout(320)
            await page.screenshot({ path: `calendar-visual-qa/05-details-closed-${prefix}.png`, fullPage: false })

            const currentMonth = page.locator('section[class*="monthSection"]').first()
            const dayFive = currentMonth.locator('button[aria-pressed]').filter({ hasText: /^5/ }).first()
            await dayFive.click()
            await page.waitForTimeout(650)
            await page.screenshot({ path: `calendar-visual-qa/06-day-panel-${prefix}.png`, fullPage: false })

            await page.getByRole('button', { name: /Abrir vista horaria de/i }).click()
            await page.waitForTimeout(520)
            await page.screenshot({ path: `calendar-visual-qa/07-day-timeline-${prefix}.png`, fullPage: false })

            await page.getByRole('button', { name: 'Cambiar vista' }).click()
            await page.waitForTimeout(250)
            await page.screenshot({ path: `calendar-visual-qa/08-timeline-menu-${prefix}.png`, fullPage: false })
            await page.getByRole('button', { name: 'Cerrar menú' }).click()

            const firstEvent = page.getByRole('button', { name: /Ensayo general/i }).last()
            if (await firstEvent.count()) {
              await firstEvent.click()
              await page.waitForTimeout(400)
              await page.screenshot({ path: `calendar-visual-qa/09-event-sheet-${prefix}.png`, fullPage: false })
            }

            const report = await page.evaluate(() => {
              const chrome = document.querySelector('[class*="topChrome"]')?.getBoundingClientRect() || null
              const popover = document.querySelector('[class*="viewPopover"]')?.getBoundingClientRect() || null
              return {
                viewport: { width: window.innerWidth, height: window.innerHeight },
                bodyScrollWidth: document.body.scrollWidth,
                documentScrollWidth: document.documentElement.scrollWidth,
                horizontalOverflow: document.documentElement.scrollWidth > window.innerWidth,
                chrome: chrome ? { top: chrome.top, bottom: chrome.bottom, width: chrome.width } : null,
                popover: popover ? { width: popover.width, right: window.innerWidth - popover.right } : null,
                visibleButtons: [...document.querySelectorAll('button')].filter((button) => {
                  const rect = button.getBoundingClientRect()
                  return rect.bottom > 0 && rect.top < window.innerHeight
                }).length,
              }
            })
            fs.writeFileSync(`calendar-visual-qa/report-${prefix}.json`, JSON.stringify({ scheme, ...report }, null, 2))
            await browser.close()
          }

          capture('dark').then(() => capture('light')).catch((error) => {
            console.error(error)
            process.exit(1)
          })
          NODE

      - name: Subir capturas
        uses: actions/upload-artifact@v4
        with:
          name: calendario-ios-visual-qa
          path: calendar-visual-qa
          if-no-files-found: error
          retention-days: 3

      - name: Mostrar log al fallar
        if: failure()
        run: cat /tmp/vida-calendar.log || true
