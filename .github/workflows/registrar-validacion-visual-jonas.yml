name: Registrar validación visual de Jonás

on:
  push:
    branches:
      - agent/fase-d-registrar-cierre-jonas
    paths:
      - scripts/fase_d/registrar_validacion_visual_jonas.py
      - .github/workflows/registrar-validacion-visual-jonas.yml

permissions:
  contents: write

jobs:
  registrar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Actualizar documento maestro
        run: python3 scripts/fase_d/registrar_validacion_visual_jonas.py

      - name: Verificar cambio esperado
        run: |
          grep -q "validación funcional de Jonás aprobada" __VIDA_INTERNACIONAL.md
          grep -q "auditoría consolidada de cierre del Bloque 4" __VIDA_INTERNACIONAL.md
          git diff --check

      - name: Commit del documento maestro
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add __VIDA_INTERNACIONAL.md
          git commit -m "docs(fase-d): registrar validación visual de Jonás"
          git push
