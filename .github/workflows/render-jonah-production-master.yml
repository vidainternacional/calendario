name: Renderizar estado productivo de Jonás

on:
  pull_request:
    branches:
      - main
    paths:
      - "docs/FASE_D_JONAS_PRODUCCION.md"
      - "scripts/stepbible/register_jonah_production_audit.py"
      - ".github/workflows/render-jonah-production-master.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Renderizar documento maestro
        run: python scripts/stepbible/register_jonah_production_audit.py
      - name: Verificar resultado
        run: |
          grep -q "Jonás importado y auditado en producción" __VIDA_INTERNACIONAL.md
          git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: vida-master-jonah-production
          path: __VIDA_INTERNACIONAL.md
          if-no-files-found: error
          retention-days: 7
