name: Limpiar estado maestro de Jonás

on:
  pull_request:
    branches:
      - main
    paths:
      - "docs/.cleanup-jonah-master-state"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/stepbible/cleanup_jonah_master_state.py
      - name: Versionar documento maestro
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add __VIDA_INTERNACIONAL.md
          git commit -m "docs(fase-d): limpiar instrucción obsoleta de Jonás"
          git push
