name: Validar estado del documento maestro

on:
  pull_request:
    branches:
      - main
    paths:
      - "__VIDA_INTERNACIONAL.md"
      - ".github/workflows/cleanup-jonah-master-state.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validar prioridad vigente del piloto
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path('__VIDA_INTERNACIONAL.md').read_text(encoding='utf-8')

          required = [
              'Fase activa: **PILOTO OPERATIVO — Validación funcional con cuentas reales**',
              '| FASE D | IA Bíblica Avanzada, fuentes, contexto, comparaciones, cronologías y mapas | **EN PAUSA OPERATIVA — BLOQUE 5 CONSERVADO** |',
              '- PR #185 abierto y listo para revisión final y fusión.',
              '- migraciones `ayuda_solidaria_solicitudes_aportes` y `optimizar_ayuda_solidaria_rls_indices` aplicadas en Supabase;',
              'No iniciar P2 hasta cerrar P1.',
              'qué cuenta usaremos como líder o pastor para completar la jerarquía de P1.',
              'No reanudar el estudio bíblico avanzado, no iniciar P2 y no crear un cuaderno separado durante este bloque.'
          ]
          missing = [value for value in required if text.count(value) != 1]
          if missing:
              raise SystemExit(f'Estado maestro del piloto inválido o duplicado: {missing}')

          combined_status = 'Estado: **PRODUCCIÓN READY — VALIDACIÓN FUNCIONAL EN CURSO; EXTENSIÓN INTERACTIVA PENDIENTE DE DESPLIEGUE**.'
          split_status = (
              'Estado: **PRODUCCIÓN READY — VALIDACIÓN FUNCIONAL EN CURSO**.' in text
              and 'Extensión interactiva implementada y pendiente de despliegue productivo.' in text
          )
          if combined_status not in text and not split_status:
              raise SystemExit('El documento maestro no conserva el estado vigente de P1 y su extensión interactiva')

          forbidden = [
              'Fase activa: **FASE D — IA Bíblica Avanzada**',
              '**ACTIVA — BLOQUE 5**',
              'Bloque 6 — IA bíblica avanzada y proveedores: **ACTIVO**',
              '## Bloque P2 — Recorridos operativos por rol\n\nEstado: **ACTIVO**',
              '## Bloque P3 — Prueba controlada de siete días\n\nEstado: **ACTIVO**',
          ]
          present = [value for value in forbidden if value in text]
          if present:
              raise SystemExit(f'El documento maestro reactivó un bloque no autorizado: {present}')

          print('Documento maestro del piloto operativo: OK')
          PY
          git diff --check
