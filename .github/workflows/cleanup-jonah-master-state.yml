name: Validar estado del documento maestro

on:
  pull_request:
    branches:
      - main
    paths:
      - "__VIDA_INTERNACIONAL.md"
      - ".github/workflows/cleanup-jonah-master-state.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validar fase activa y reglas globales
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path('__VIDA_INTERNACIONAL.md').read_text(encoding='utf-8')

          required_once = [
              'Fase / prioridad activa: **FASE F — EVOLUCIÓN CORRELATIVA DE BIBLIA → NOTAS**',
              '| FASE D | IA Bíblica Avanzada, fuentes, contexto, comparaciones, cronologías y mapas | **COMPLETADA — 2026-08-12** |',
              '| FASE E | Rendimiento, seguridad, escalabilidad, pruebas y documentación | **COMPLETADA — 2026-08-13** |',
              '| FASE F | Evolución correlativa de Biblia → Notas | **ACTIVA — 2026-08-13** |',
              '# PILOTO OPERATIVO — EN PAUSA',
              '# FASE F — ACTIVA — EVOLUCIÓN CORRELATIVA DE BIBLIA → NOTAS',
              '# Siguiente punto autorizado',
              '**Principio visual global:**',
              '**Navegación móvil global:**',
              '**Historial reversible:**',
          ]
          missing = [value for value in required_once if text.count(value) != 1]
          if missing:
              raise SystemExit(f'Estado maestro vigente inválido o duplicado: {missing}')

          allowed_next_gates = [
              'Continuar exclusivamente FASE F con el punto 6 del alcance',
              'Realizar exclusivamente el cierre técnico/documental de FASE F',
          ]
          present_gates = [value for value in allowed_next_gates if value in text]
          if len(present_gates) != 1:
              raise SystemExit(f'El documento maestro no tiene un único siguiente punto autorizado de FASE F: {present_gates}')

          active_lines = [line for line in text.splitlines() if line.startswith('Fase / prioridad activa:')]
          if active_lines != ['Fase / prioridad activa: **FASE F — EVOLUCIÓN CORRELATIVA DE BIBLIA → NOTAS**']:
              raise SystemExit(f'La prioridad activa no es única o no coincide con FASE F: {active_lines}')

          forbidden = [
              'Fase / prioridad activa: **FASE D — IA Bíblica Avanzada**',
              'Fase activa: **PILOTO OPERATIVO — Validación funcional con cuentas reales**',
              '## Bloque P2 — Recorridos operativos por rol\n\nEstado: **ACTIVO**',
              '## Bloque P3 — Prueba controlada de siete días\n\nEstado: **ACTIVO**',
          ]
          present = [value for value in forbidden if value in text]
          if present:
              raise SystemExit(f'El documento maestro reactivó una prioridad cerrada o pausada: {present}')

          print('Documento maestro: FASE F activa, piloto pausado y siguiente gate único: OK')
          PY
          git diff --check
