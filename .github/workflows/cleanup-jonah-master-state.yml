name: Validar estado del documento maestro

on:
  pull_request:
    branches:
      - main
    paths:
      - "__VIDA_INTERNACIONAL.md"
      - ".github/workflows/cleanup-jonah-master-state.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validar prioridad vigente del piloto
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path('__VIDA_INTERNACIONAL.md').read_text(encoding='utf-8')

          required = [
              'Fase activa: **PILOTO OPERATIVO — Validación funcional con cuentas reales**',
              '| FASE D | IA Bíblica Avanzada, fuentes, contexto, comparaciones, cronologías y mapas | **EN PAUSA OPERATIVA — BLOQUE 5 CONSERVADO** |',
              'Estado: **PRODUCCIÓN READY — VALIDACIÓN FUNCIONAL EN CURSO**.',
              'producción `dpl_2UN2e4eiCvPo9gMVrrhqiYfoTZKF` — `READY`;',
              '6. Define qué cuenta usaremos como líder o pastor para completar la jerarquía de P1.'
          ]
          missing = [value for value in required if text.count(value) != 1]
          if missing:
              raise SystemExit(f'Estado maestro del piloto inválido o duplicado: {missing}')

          forbidden = [
              'Fase activa: **FASE D — IA Bíblica Avanzada**',
              '**ACTIVA — BLOQUE 5**',
              'Bloque 6 — IA bíblica avanzada y proveedores: **ACTIVO**',
              '## Bloque P2 — Recorridos operativos por rol\n\nEstado: **ACTIVO**',
          ]
          present = [value for value in forbidden if value in text]
          if present:
              raise SystemExit(f'El documento maestro reactivó un bloque no autorizado: {present}')

          print('Documento maestro del piloto operativo: OK')
          PY
          git diff --check
