name: Corregir variantes Qere en campo ortográfico

on:
  pull_request:
    branches:
      - main
    paths:
      - "docs/.patch-tahot-qere-spelling-variants"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Aplicar parche exacto
        run: |
          if [ ! -f scripts/stepbible/patch_tahot_qere_spelling_variants.py ]; then
            echo "Auxiliar retirado; no hay parche pendiente"
            exit 0
          fi
          python scripts/stepbible/patch_tahot_qere_spelling_variants.py
          python scripts/stepbible/build_tahot_import_payload.py --self-test
      - name: Versionar generador
        run: |
          if git diff --quiet -- scripts/stepbible/build_tahot_import_payload.py; then
            echo "Sin cambios pendientes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/stepbible/build_tahot_import_payload.py
          git commit -m "fix(fase-d): separar Ketiv de variantes ortográficas"
          git push
