name: FASE H nombres propios Wikidata draft

on:
  push:
    branches:
      - agent/fase-h-hebreo-biblico
    paths:
      - .github/workflows/fase-h-proper-names-wikidata-draft.yml
      - scripts/hebreo/build_tipnr_wikidata_draft.py
      - scripts/hebreo/fetch_wikidata_labels.py
      - scripts/hebreo/split_tipnr_wikidata_confirmed_chunks.py

permissions:
  contents: write

jobs:
  build-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/fase-h-hebreo-biblico
          fetch-depth: 0

      - name: Validar scripts
        run: |
          python3 scripts/hebreo/fetch_wikidata_labels.py --self-test
          python3 scripts/hebreo/build_tipnr_wikidata_draft.py --self-test
          python3 scripts/hebreo/split_tipnr_wikidata_confirmed_chunks.py --self-test

      - name: Descargar crosswalk TIPNR fijado por blob
        env:
          TIPNR_BLOB: abc3e21b9d08dc310066152f9b62858c4818f4eb
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          blob = os.environ['TIPNR_BLOB']
          url = f'https://api.github.com/repos/PatristicTextArchive/tipnr_data/git/blobs/{blob}'
          req = urllib.request.Request(url, headers={'User-Agent':'VIDA-Internacional-Hebreo/1.0'})
          with urllib.request.urlopen(req, timeout=30) as response:
              payload = json.load(response)
          if payload.get('sha') != blob:
              raise SystemExit('Blob TIPNR inesperado')
          content = base64.b64decode(payload['content'])
          open('/tmp/tipnr-persons-wikidata.tsv','wb').write(content)
          print(f'TIPNR bytes={len(content)} blob={blob}')
          PY

      - name: Obtener etiquetas Wikidata CC0
        run: |
          python3 scripts/hebreo/fetch_wikidata_labels.py \
            --tipnr-wikidata-tsv /tmp/tipnr-persons-wikidata.tsv \
            --output /tmp/wikidata-labels.tsv \
            --audit /tmp/wikidata-labels-audit.json \
            --batch-size 50 \
            --sleep-ms 150

      - name: Generar borrador auditable y chunks con doble evidencia
        run: |
          mkdir -p supabase/migration-drafts docs/audits
          python3 scripts/hebreo/build_tipnr_wikidata_draft.py \
            --tipnr-wikidata-tsv /tmp/tipnr-persons-wikidata.tsv \
            --wikidata-labels-tsv /tmp/wikidata-labels.tsv \
            --output-sql supabase/migration-drafts/fase_h_nombres_wikidata_20260820.sql \
            --audit docs/audits/fase_h_nombres_wikidata_20260820.json
          python3 scripts/hebreo/split_tipnr_wikidata_confirmed_chunks.py \
            --input-sql supabase/migration-drafts/fase_h_nombres_wikidata_20260820.sql \
            --output-dir supabase/migration-drafts/nombres-wikidata-anchor2 \
            --audit docs/audits/fase_h_nombres_wikidata_anchor2_chunks_20260820.json \
            --chunk-size 40
          cp /tmp/wikidata-labels-audit.json docs/audits/fase_h_wikidata_labels_20260820.json

      - name: Verificar que los chunks tienen gate conservador
        run: |
          grep -q 'BORRADOR NO ACTIVO' supabase/migration-drafts/fase_h_nombres_wikidata_20260820.sql
          grep -q "context_used_as_meaning',false" supabase/migration-drafts/fase_h_nombres_wikidata_20260820.sql
          grep -R -q 'spanish_anchor_sources >= 2' supabase/migration-drafts/nombres-wikidata-anchor2
          grep -R -q "exact_source_entity',true" supabase/migration-drafts/nombres-wikidata-anchor2
          grep -R -q "split_part(e.source_gloss,'»',1)" supabase/migration-drafts/nombres-wikidata-anchor2
          grep -R -q "anchor_used_for_name_spelling_only',true" supabase/migration-drafts/nombres-wikidata-anchor2
          grep -R -q 'on conflict (lexical_entry_id) do nothing' supabase/migration-drafts/nombres-wikidata-anchor2
          ! grep -R "createClient\|SUPABASE_SERVICE_ROLE\|psql" supabase/migration-drafts/fase_h_nombres_wikidata_20260820.sql supabase/migration-drafts/nombres-wikidata-anchor2

      - name: Promover chunks verificados a migraciones insert-only
        run: |
          for src in supabase/migration-drafts/nombres-wikidata-anchor2/fase_h_nombres_wikidata_anchor2_chunk_*.sql; do
            idx=$(basename "$src" | sed -E 's/.*chunk_([0-9]{3})\.sql/\1/')
            sec=$(printf '%02d' $((10#$idx)))
            dst="supabase/migrations/202608210401${sec}_fase_h_nombres_wikidata_anchor2_${idx}.sql"
            sed \
              -e 's/^-- BORRADOR NO ACTIVO /-- /' \
              -e 's/^-- No aplicar sin auditoría read-only del lote\./-- Gate estructural auditado; aplicación insert-only reversible./' \
              "$src" > "$dst"
          done
          test "$(find supabase/migrations -maxdepth 1 -name '202608210401*_fase_h_nombres_wikidata_anchor2_*.sql' | wc -l | tr -d ' ')" = '14'

      - name: Versionar borradores, migraciones y auditorías
        run: |
          git config user.name 'vida-hebreo-data-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migration-drafts/fase_h_nombres_wikidata_20260820.sql \
                  supabase/migration-drafts/nombres-wikidata-anchor2 \
                  supabase/migrations/202608210401*_fase_h_nombres_wikidata_anchor2_*.sql \
                  docs/audits/fase_h_nombres_wikidata_20260820.json \
                  docs/audits/fase_h_nombres_wikidata_anchor2_chunks_20260820.json \
                  docs/audits/fase_h_wikidata_labels_20260820.json
          if git diff --cached --quiet; then
            echo 'Sin cambios que versionar.'
          else
            git commit -m 'data(fase-h): versionar nombres con identidad exacta'
            git push origin HEAD:agent/fase-h-hebreo-biblico
          fi
