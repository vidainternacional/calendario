name: Aplicar hito TAHOT al documento maestro

on:
  push:
    branches:
      - fase-d/esquema-columnas-tahot
    paths:
      - ".github/workflows/apply-tahot-schema-master-update.yml"
      - "scripts/stepbible/apply_tahot_schema_master_update.py"

permissions:
  contents: write

jobs:
  update-master:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fase-d/esquema-columnas-tahot
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Actualizar documento maestro
        run: |
          python scripts/stepbible/apply_tahot_schema_master_update.py
          git diff --check

      - name: Versionar actualización
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "vida-internacional-bot"
          git config user.email "actions@users.noreply.github.com"
          git add __VIDA_INTERNACIONAL.md
          git commit -m "docs(fase-d): registrar contrato TAHOT verificado"
          git push origin HEAD:fase-d/esquema-columnas-tahot
