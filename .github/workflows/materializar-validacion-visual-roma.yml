name: Materializar validación visual de Roma

on:
  push:
    branches:
      - agent/fase-d-maestro-validacion-visual-roma

permissions:
  contents: write

jobs:
  materializar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fase-d-maestro-validacion-visual-roma
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Registrar hito y retirar auxiliares
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          master = Path('__VIDA_INTERNACIONAL.md')
          marker = '### Avance confirmado del Bloque 5 — validación visual de Roma en producción'
          text = master.read_text(encoding='utf-8').rstrip() + '\n'
          if marker not in text:
              text += '''

### Avance confirmado del Bloque 5 — validación visual de Roma en producción

La integración visual limitada del paquete `rome-pilot-v1` fue validada por el usuario en producción el 2026-08-03.

Resultado confirmado:

- panel `Cronología y mapa` visible en Estudio Profundo para Hechos 28;
- evento `Llegada de Pablo a Roma` mostrado para Hechos 28:14–31;
- periodo relativo, precisión y certeza visibles;
- Roma mostrada con coordenadas aproximadas `41.889977, 12.491258`;
- atribución a Pleiades conservada;
- enlace externo de ubicación disponible;
- el estudio bíblico existente permanece funcional;
- consultas servidas únicamente desde el contrato `server-only`, sesión autenticada y RLS.

Evidencia:

- PR #164 y commit de fusión `8f06db4bb63860877b8bed1a01accac10be9139d`;
- deployment de producción Vercel `dpl_5KDyB5RTkrvzm8diwHSEfa8HLh7M` en estado `READY`;
- PR #165 y commit de fusión `44112b0960421cb8647484cd67ddf96e59f1a8e5`;
- `docs/FASE_D_BLOQUE_5_VALIDACION_VISUAL_ROMA.md`.

No se amplió el catálogo de lugares y no se avanzó al Bloque 6.

**Siguiente punto autorizado:** auditar el comportamiento del panel con Romanos 1, Romanos 16 y una referencia sin eventos; corregir únicamente problemas de alcance, duplicación, atribución o visibilidad detectados. Después de esa validación funcional cruzada, registrar el resultado antes de decidir si se amplía el catálogo del Bloque 5. No avanzar al Bloque 6.
'''
          master.write_text(text.rstrip() + '\n', encoding='utf-8')
          PY
          rm -f .github/workflows/materializar-validacion-visual-roma.yml
          rm -f docs/.materializar-validacion-visual-roma
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add __VIDA_INTERNACIONAL.md .github/workflows/materializar-validacion-visual-roma.yml docs/.materializar-validacion-visual-roma
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs(fase-d): registrar validación visual de Roma en maestro"
          git push origin HEAD:agent/fase-d-maestro-validacion-visual-roma
