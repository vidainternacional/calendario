name: Aplicar actualización aprobada del maestro

on:
  push:
    branches:
      - fix/usuarios-pendientes-badges

permissions:
  contents: write

jobs:
  actualizar-maestro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/usuarios-pendientes-badges
      - name: Actualizar __VIDA_INTERNACIONAL.md
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('__VIDA_INTERNACIONAL.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace('Última actualización: 2026-09-07', 'Última actualización: 2026-09-15', 1)

          marker = "Pendiente transversal diferido: optimizar al final la latencia ocasional de badges/push entre Supabase, cliente, service worker, segundo plano, red e iOS, sin parches aislados por pantalla. Este pendiente pasa formalmente a FASE G y queda cerrado en su evidencia final."
          addition = "\n\n**Badges globales — VALIDADO — 2026-09-15.** El conteo del ícono de la app y el badge interno de Avisos quedan sincronizados con los pendientes reales del usuario. Desde Avisos, cada pendiente conduce al área correspondiente para resolverlo según rol y permisos, incluyendo usuarios, ministerios, solicitudes, servicios, contactos, buzón pastoral y Ayuda Solidaria. Al resolverse, el conteo debe disminuir en todo el recorrido."

          if 'Badges globales — VALIDADO — 2026-09-15' not in text:
              if marker not in text:
                  raise SystemExit('No se encontró el punto exacto de inserción en el maestro')
              text = text.replace(marker, marker + addition, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/__temp_update_vida_master.yml
          git add __VIDA_INTERNACIONAL.md
          git commit -m "docs: registrar badges globales validados"
          git push origin HEAD:fix/usuarios-pendientes-badges
