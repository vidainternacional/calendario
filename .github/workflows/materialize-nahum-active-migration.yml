name: Materializar migración activa de Nahúm

on:
  pull_request:
    branches:
      - main
    paths:
      - "docs/.materialize-nahum-active-migration"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar migración activa exacta
        run: |
          if [ ! -f scripts/stepbible/activate_nahum_migration.py ]; then
            echo "Activador retirado; no hay migración pendiente"
            exit 0
          fi
          python scripts/stepbible/activate_nahum_migration.py --self-test
          python scripts/stepbible/activate_nahum_migration.py \
            --draft supabase/migration-drafts/20260803040000_importador_payload_tahot_nahum.sql \
            --output supabase/migrations/20260803043000_generalizar_importador_payload_tahot_nahum.sql
      - name: Versionar migración
        run: |
          if git diff --quiet -- supabase/migrations/20260803043000_generalizar_importador_payload_tahot_nahum.sql \
             && git ls-files --error-unmatch supabase/migrations/20260803043000_generalizar_importador_payload_tahot_nahum.sql >/dev/null 2>&1; then
            echo "Migración ya materializada"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260803043000_generalizar_importador_payload_tahot_nahum.sql
          git commit -m "feat(fase-d): materializar migración activa de Nahúm"
          git push
