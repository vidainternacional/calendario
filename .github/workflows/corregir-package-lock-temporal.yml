name: Corregir package-lock temporal

on:
  push:
    branches:
      - agent/fase-d-bloque-5-diagnostico
    paths:
      - .github/workflows/corregir-package-lock-temporal.yml

permissions:
  contents: write

jobs:
  corregir-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Sincronizar package-lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verificar cambio limitado
        run: |
          git diff --check
          test -n "$(git status --short package-lock.json)"
          test -z "$(git status --short --untracked-files=no | grep -v 'package-lock.json')"

      - name: Commit del lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sincronizar package-lock con package.json"
          git push
