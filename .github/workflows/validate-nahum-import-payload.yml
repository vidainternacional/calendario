name: Validar payload de importación de Nahúm

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/stepbible/audit_nahum_import_payload.py"
      - ".github/workflows/validate-nahum-import-payload.yml"
      - "docs/FASE_D_PAYLOAD_TAHOT_NAHUM.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ejecutar auto-tests
        run: |
          python scripts/stepbible/tahot_schema.py --self-test
          python scripts/stepbible/extract_ot_book.py --self-test
          python scripts/stepbible/tahot_components.py
          python scripts/stepbible/build_tahot_import_payload.py --self-test
          python scripts/stepbible/audit_nahum_import_payload.py --self-test
      - name: Generar paquete y payload A
        run: |
          python scripts/stepbible/extract_ot_book.py \
            --book Nam \
            --output artifacts/nahum-payload-a
          test "$(sha256sum artifacts/nahum-payload-a/nam.json.gz | cut -d' ' -f1)" = \
            "60e280a6d94abc8788b7cc9647e4dfa0f679e0a9708a1adf00be30abfc23b7f5"
          python scripts/stepbible/build_tahot_import_payload.py \
            artifacts/nahum-payload-a/nam.json.gz \
            --policy scripts/stepbible/nahum_affix_lemma_policy.json \
            --output artifacts/nahum-payload-a/import-payload.json
      - name: Generar paquete y payload B
        run: |
          python scripts/stepbible/extract_ot_book.py \
            --book Nam \
            --output artifacts/nahum-payload-b
          python scripts/stepbible/build_tahot_import_payload.py \
            artifacts/nahum-payload-b/nam.json.gz \
            --policy scripts/stepbible/nahum_affix_lemma_policy.json \
            --output artifacts/nahum-payload-b/import-payload.json
      - name: Verificar reproducibilidad byte a byte
        run: |
          cmp artifacts/nahum-payload-a/import-payload.json \
              artifacts/nahum-payload-b/import-payload.json
          sha256sum artifacts/nahum-payload-a/import-payload.json \
            | tee artifacts/nahum-payload-a/payload-file-sha256.txt
      - name: Auditar payload
        run: |
          python scripts/stepbible/audit_nahum_import_payload.py \
            --payload artifacts/nahum-payload-a/import-payload.json \
            --output artifacts/nahum-payload-a/import-payload-audit.json
          git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: stepbible-nahum-import-payload
          path: |
            artifacts/nahum-payload-a/manifest.json
            artifacts/nahum-payload-a/import-payload.json
            artifacts/nahum-payload-a/import-payload-audit.json
            artifacts/nahum-payload-a/payload-file-sha256.txt
          if-no-files-found: error
          retention-days: 14
