name: Registrar diagnóstico del Bloque 5

on:
  push:
    branches:
      - agent/fase-d-registrar-diagnostico-bloque-5
    paths:
      - scripts/fase_d/registrar_diagnostico_bloque_5.py
      - .github/workflows/registrar-diagnostico-bloque-5.yml

permissions:
  contents: write

jobs:
  actualizar-maestro:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Actualizar documento maestro
        run: python3 scripts/fase_d/registrar_diagnostico_bloque_5.py

      - name: Verificar resultado
        run: |
          grep -q "diagnóstico de cronologías y mapas" __VIDA_INTERNACIONAL.md
          grep -q "30820270864" __VIDA_INTERNACIONAL.md
          grep -q "esquema piloto de Roma" __VIDA_INTERNACIONAL.md
          git diff --check

      - name: Commit del documento maestro
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add __VIDA_INTERNACIONAL.md
          git commit -m "docs(fase-d): registrar diagnóstico del Bloque 5"
          git push
