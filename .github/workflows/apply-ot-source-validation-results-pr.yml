name: Aplicar resultados TAHOT desde PR

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/stepbible/apply_ot_source_validation_results.py"
      - ".github/workflows/apply-ot-source-validation-results-pr.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Aplicar resultados
        run: python scripts/stepbible/apply_ot_source_validation_results.py

      - name: Validar diferencias
        run: git diff --check

      - name: Confirmar cambios
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "vida-internacional-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            scripts/stepbible/inspect_ot_sources.py \
            docs/FASE_D_FUENTES_TEXTUALES_AT.md \
            __VIDA_INTERNACIONAL.md
          git commit -m "docs(fase-d): fijar validación textual del Antiguo Testamento"
          git push origin HEAD:${{ github.head_ref }}
