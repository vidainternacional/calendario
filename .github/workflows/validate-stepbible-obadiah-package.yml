name: Validar paquete TAHOT de Obadías

on:
  push:
    branches:
      - fase-d/paquete-tahot-obadias
    paths:
      - "scripts/stepbible/extract_ot_book.py"
      - "scripts/stepbible/tahot_schema.py"
      - "scripts/stepbible/inspect_ot_sources.py"
      - ".github/workflows/validate-stepbible-obadiah-package.yml"
      - "docs/FASE_D_PAQUETE_TAHOT_OBADIAS.md"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/stepbible/extract_ot_book.py"
      - "scripts/stepbible/tahot_schema.py"
      - "scripts/stepbible/inspect_ot_sources.py"
      - ".github/workflows/validate-stepbible-obadiah-package.yml"
      - "docs/FASE_D_PAQUETE_TAHOT_OBADIAS.md"
  workflow_dispatch:

concurrency:
  group: validate-stepbible-obadiah-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar auto-tests
        run: |
          python scripts/stepbible/tahot_schema.py --self-test
          python scripts/stepbible/extract_ot_book.py --self-test

      - name: Generar paquete completo de Obadías
        run: python scripts/stepbible/extract_ot_book.py --book Oba --output artifacts/stepbible-obadiah

      - name: Mostrar auditoría
        run: cat artifacts/stepbible-obadiah/audit.md

      - uses: actions/upload-artifact@v4
        with:
          name: stepbible-obadiah-package
          path: artifacts/stepbible-obadiah
          if-no-files-found: error
          retention-days: 14
