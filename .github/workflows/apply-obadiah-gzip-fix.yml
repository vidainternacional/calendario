name: Corregir compresión del paquete de Obadías

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/apply-obadiah-gzip-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fase-d/paquete-tahot-obadias
          fetch-depth: 0

      - name: Aplicar corrección mínima
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/stepbible/extract_ot_book.py')
          text = path.read_text(encoding='utf-8')
          old = '''    with gzip.open(path, "wb", compresslevel=9, mtime=0) as handle:
        handle.write(data)
'''
          new = '''    with path.open("wb") as raw_handle:
        with gzip.GzipFile(
            fileobj=raw_handle,
            mode="wb",
            compresslevel=9,
            mtime=0,
            filename="",
        ) as handle:
            handle.write(data)
'''
          if new in text:
              print('Corrección ya aplicada')
          elif text.count(old) == 1:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          else:
              raise SystemExit('No se encontró la llamada gzip esperada')
          PY
          git diff --check

      - name: Versionar corrección
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "vida-internacional-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/stepbible/extract_ot_book.py
          git commit -m "fix(fase-d): generar gzip determinista para Obadías"
          git push origin HEAD:fase-d/paquete-tahot-obadias
