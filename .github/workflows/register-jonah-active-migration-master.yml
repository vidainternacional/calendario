name: Registrar migración activa de Jonás

on:
  pull_request:
    branches:
      - main
    paths:
      - "docs/.register-jonah-active-migration"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-master:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Registrar migración activa
        run: python scripts/stepbible/register_jonah_active_migration_master.py
      - name: Versionar maestro
        run: |
          if git diff --quiet -- __VIDA_INTERNACIONAL.md; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add __VIDA_INTERNACIONAL.md
          git commit -m "docs(fase-d): autorizar aplicación controlada de Jonás"
          git push
