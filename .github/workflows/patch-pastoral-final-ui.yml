name: Patch pastoral final UI

on:
  push:
    branches:
      - agent/centro-pastoral-reorganizacion
    paths:
      - .github/workflows/patch-pastoral-final-ui.yml

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/centro-pastoral-reorganizacion

      - name: Apply targeted pastoral UI changes
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('components/pastoral/PastoralVisualWorkspaceV4.tsx')
          text = path.read_text()

          old = '<button type="button" onClick={() => usarRecursoComoImagen(recurso)} className="min-h-9 border-r border-slate-100 px-1 text-[10px] font-black text-slate-600" aria-label={`Usar ${recurso.titulo} como imagen`}>Imagen</button>'
          new = '<button type="button" onClick={() => usarRecursoComoImagen(recurso)} className={`min-h-9 border-r border-slate-100 px-1 text-[10px] font-black ${elementoSeleccionado?.tipo === \'imagen\' && elementoSeleccionado.recurso_id === recurso.id && !elementoSeleccionado.es_capa_fondo ? \'text-indigo-600\' : \'text-slate-600\'}`} aria-pressed={Boolean(elementoSeleccionado?.tipo === \'imagen\' && elementoSeleccionado.recurso_id === recurso.id && !elementoSeleccionado.es_capa_fondo)} aria-label={`Usar ${recurso.titulo} como imagen`}>Imagen</button>'
          if old not in text: raise SystemExit('image target missing')
          text = text.replace(old, new, 1)

          old = '<button type="button" onClick={() => usarRecursoComoFondo(recurso)} className="min-h-9 px-1 text-[10px] font-black text-indigo-600" aria-label={`Usar ${recurso.titulo} como fondo`}>Fondo</button>'
          new = '<button type="button" onClick={() => usarRecursoComoFondo(recurso)} className={`min-h-9 px-1 text-[10px] font-black ${((elementoSeleccionado?.tipo === \'imagen\' && elementoSeleccionado.recurso_id === recurso.id && elementoSeleccionado.es_capa_fondo) || (pagina.fondo_modo === \'imagen\' && (pagina.fondo_recurso_id ?? pagina.recurso_id) === recurso.id)) ? \'text-indigo-600\' : \'text-slate-600\'}`} aria-pressed={Boolean((elementoSeleccionado?.tipo === \'imagen\' && elementoSeleccionado.recurso_id === recurso.id && elementoSeleccionado.es_capa_fondo) || (pagina.fondo_modo === \'imagen\' && (pagina.fondo_recurso_id ?? pagina.recurso_id) === recurso.id))} aria-label={`Usar ${recurso.titulo} como fondo`}>Fondo</button>'
          if old not in text: raise SystemExit('background target missing')
          text = text.replace(old, new, 1)

          old = '''<label className="flex items-center gap-3"><span className="w-[78px] shrink-0 text-[11px] font-black text-slate-500">Fusión</span><select disabled={elementoSeleccionado.bloqueado} value={elementoSeleccionado.modo_fusion ?? 'normal'} onPointerDown={() => !elementoSeleccionado.bloqueado && registrarHistorial()} onChange={(event) => !elementoSeleccionado.bloqueado && patchElementoSinHistorial(elementoSeleccionado.id, { modo_fusion: event.target.value as ModoFusion })} className="min-h-10 min-w-0 flex-1 rounded-full border border-slate-200 bg-white px-3 text-xs font-bold text-slate-700 outline-none disabled:opacity-30" aria-label="Modo de fusión de la capa seleccionada">{MODOS_FUSION.map((modo) => <option key={modo.id} value={modo.id}>{modo.label}</option>)}</select></label>
        <small className="pl-[90px] leading-4 text-slate-400">La capa seleccionada se fusiona visualmente con todas las capas que tenga debajo, sin destruir ninguna.</small>
        {elementoSeleccionado.tipo === 'imagen' && <button type="button" disabled={elementoSeleccionado.bloqueado} onClick={() => elementoSeleccionado.es_capa_fondo ? convertirFondoEnImagen(elementoSeleccionado.id) : convertirImagenEnFondo(elementoSeleccionado.id)} className="ml-[90px] inline-flex min-h-9 w-fit items-center rounded-full border border-slate-200 bg-white px-3 text-[10px] font-black text-slate-600 disabled:opacity-30">{elementoSeleccionado.es_capa_fondo ? 'Convertir a imagen' : 'Convertir a fondo'}</button>}'''
          new = '''<div className="flex items-center gap-2"><span className="w-[78px] shrink-0 text-[11px] font-black text-slate-500">Fusión</span><select disabled={elementoSeleccionado.bloqueado} value={elementoSeleccionado.modo_fusion ?? 'normal'} onPointerDown={() => !elementoSeleccionado.bloqueado && registrarHistorial()} onChange={(event) => !elementoSeleccionado.bloqueado && patchElementoSinHistorial(elementoSeleccionado.id, { modo_fusion: event.target.value as ModoFusion })} className="min-h-10 min-w-0 flex-1 rounded-full border border-slate-200 bg-white px-3 text-xs font-bold text-slate-700 outline-none disabled:opacity-30" aria-label="Modo de fusión de la capa seleccionada">{MODOS_FUSION.map((modo) => <option key={modo.id} value={modo.id}>{modo.label}</option>)}</select>{elementoSeleccionado.tipo === 'imagen' && <button type="button" disabled={elementoSeleccionado.bloqueado} onClick={() => elementoSeleccionado.es_capa_fondo ? convertirFondoEnImagen(elementoSeleccionado.id) : convertirImagenEnFondo(elementoSeleccionado.id)} className="inline-flex min-h-10 shrink-0 items-center whitespace-nowrap rounded-full border border-slate-200 bg-white px-2 text-[9px] font-black text-slate-600 disabled:opacity-30">{elementoSeleccionado.es_capa_fondo ? 'Convertir a imagen' : 'Convertir a fondo'}</button>}</div>
        <small className="pl-[90px] leading-4 text-slate-400">La capa seleccionada se fusiona visualmente con todas las capas que tenga debajo, sin destruir ninguna.</small>'''
          if old not in text: raise SystemExit('fusion target missing')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Generate ephemeral VAPID
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const webpush = require('web-push')
          const keys = webpush.generateVAPIDKeys()
          fs.appendFileSync(process.env.GITHUB_ENV, `VAPID_SUBJECT=mailto:ci@example.invalid\n`)
          fs.appendFileSync(process.env.GITHUB_ENV, `NEXT_PUBLIC_VAPID_PUBLIC_KEY=${keys.publicKey}\n`)
          fs.appendFileSync(process.env.GITHUB_ENV, `VAPID_PRIVATE_KEY=${keys.privateKey}\n`)
          NODE

      - name: Build patched source
        run: npm run build
        env:
          CI: 'true'

      - name: Upload patched source
        uses: actions/upload-artifact@v4
        with:
          name: patched-pastoral-source
          path: components/pastoral/PastoralVisualWorkspaceV4.tsx
          retention-days: 1
