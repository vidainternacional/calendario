name: Patch pastoral final UI

on:
  push:
    branches:
      - agent/centro-pastoral-reorganizacion
    paths:
      - .github/workflows/patch-pastoral-final-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/centro-pastoral-reorganizacion
          fetch-depth: 0

      - name: Apply targeted pastoral UI changes
        shell: python
        run: |
          from pathlib import Path

          path = Path('components/pastoral/PastoralVisualWorkspaceV4.tsx')
          text = path.read_text()

          old_image = '''<button type="button" onClick={() => usarRecursoComoImagen(recurso)} className="min-h-9 border-r border-slate-100 px-1 text-[10px] font-black text-slate-600" aria-label={`Usar ${recurso.titulo} como imagen`}>Imagen</button>'''
          new_image = '''<button type="button" onClick={() => usarRecursoComoImagen(recurso)} className={`min-h-9 border-r border-slate-100 px-1 text-[10px] font-black ${elementoSeleccionado?.tipo === 'imagen' && elementoSeleccionado.recurso_id === recurso.id && !elementoSeleccionado.es_capa_fondo ? 'text-indigo-600' : 'text-slate-600'}`} aria-pressed={Boolean(elementoSeleccionado?.tipo === 'imagen' && elementoSeleccionado.recurso_id === recurso.id && !elementoSeleccionado.es_capa_fondo)} aria-label={`Usar ${recurso.titulo} como imagen`}>Imagen</button>'''
          if old_image not in text:
              raise SystemExit('Image button target not found')
          text = text.replace(old_image, new_image, 1)

          old_bg = '''<button type="button" onClick={() => usarRecursoComoFondo(recurso)} className="min-h-9 px-1 text-[10px] font-black text-indigo-600" aria-label={`Usar ${recurso.titulo} como fondo`}>Fondo</button>'''
          new_bg = '''<button type="button" onClick={() => usarRecursoComoFondo(recurso)} className={`min-h-9 px-1 text-[10px] font-black ${((elementoSeleccionado?.tipo === 'imagen' && elementoSeleccionado.recurso_id === recurso.id && elementoSeleccionado.es_capa_fondo) || (pagina.fondo_modo === 'imagen' && (pagina.fondo_recurso_id ?? pagina.recurso_id) === recurso.id)) ? 'text-indigo-600' : 'text-slate-600'}`} aria-pressed={Boolean((elementoSeleccionado?.tipo === 'imagen' && elementoSeleccionado.recurso_id === recurso.id && elementoSeleccionado.es_capa_fondo) || (pagina.fondo_modo === 'imagen' && (pagina.fondo_recurso_id ?? pagina.recurso_id) === recurso.id))} aria-label={`Usar ${recurso.titulo} como fondo`}>Fondo</button>'''
          if old_bg not in text:
              raise SystemExit('Background button target not found')
          text = text.replace(old_bg, new_bg, 1)

          old_fusion = '''<label className="flex items-center gap-3"><span className="w-[78px] shrink-0 text-[11px] font-black text-slate-500">Fusión</span><select disabled={elementoSeleccionado.bloqueado} value={elementoSeleccionado.modo_fusion ?? 'normal'} onPointerDown={() => !elementoSeleccionado.bloqueado && registrarHistorial()} onChange={(event) => !elementoSeleccionado.bloqueado && patchElementoSinHistorial(elementoSeleccionado.id, { modo_fusion: event.target.value as ModoFusion })} className="min-h-10 min-w-0 flex-1 rounded-full border border-slate-200 bg-white px-3 text-xs font-bold text-slate-700 outline-none disabled:opacity-30" aria-label="Modo de fusión de la capa seleccionada">{MODOS_FUSION.map((modo) => <option key={modo.id} value={modo.id}>{modo.label}</option>)}</select></label>
        <small className="pl-[90px] leading-4 text-slate-400">La capa seleccionada se fusiona visualmente con todas las capas que tenga debajo, sin destruir ninguna.</small>
        {elementoSeleccionado.tipo === 'imagen' && <button type="button" disabled={elementoSeleccionado.bloqueado} onClick={() => elementoSeleccionado.es_capa_fondo ? convertirFondoEnImagen(elementoSeleccionado.id) : convertirImagenEnFondo(elementoSeleccionado.id)} className="ml-[90px] inline-flex min-h-9 w-fit items-center rounded-full border border-slate-200 bg-white px-3 text-[10px] font-black text-slate-600 disabled:opacity-30">{elementoSeleccionado.es_capa_fondo ? 'Convertir a imagen' : 'Convertir a fondo'}</button>}'''
          new_fusion = '''<div className="flex items-center gap-2"><span className="w-[78px] shrink-0 text-[11px] font-black text-slate-500">Fusión</span><select disabled={elementoSeleccionado.bloqueado} value={elementoSeleccionado.modo_fusion ?? 'normal'} onPointerDown={() => !elementoSeleccionado.bloqueado && registrarHistorial()} onChange={(event) => !elementoSeleccionado.bloqueado && patchElementoSinHistorial(elementoSeleccionado.id, { modo_fusion: event.target.value as ModoFusion })} className="min-h-10 min-w-0 flex-1 rounded-full border border-slate-200 bg-white px-3 text-xs font-bold text-slate-700 outline-none disabled:opacity-30" aria-label="Modo de fusión de la capa seleccionada">{MODOS_FUSION.map((modo) => <option key={modo.id} value={modo.id}>{modo.label}</option>)}</select>{elementoSeleccionado.tipo === 'imagen' && <button type="button" disabled={elementoSeleccionado.bloqueado} onClick={() => elementoSeleccionado.es_capa_fondo ? convertirFondoEnImagen(elementoSeleccionado.id) : convertirImagenEnFondo(elementoSeleccionado.id)} className="inline-flex min-h-10 shrink-0 items-center whitespace-nowrap rounded-full border border-slate-200 bg-white px-2 text-[9px] font-black text-slate-600 disabled:opacity-30">{elementoSeleccionado.es_capa_fondo ? 'Convertir a imagen' : 'Convertir a fondo'}</button>}</div>
        <small className="pl-[90px] leading-4 text-slate-400">La capa seleccionada se fusiona visualmente con todas las capas que tenga debajo, sin destruir ninguna.</small>'''
          if old_fusion not in text:
              raise SystemExit('Fusion row target not found')
          text = text.replace(old_fusion, new_fusion, 1)

          path.write_text(text)

      - name: Verify build
        run: |
          npm ci
          npm run build

      - name: Commit targeted changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-pastoral-final-ui.yml
          git add components/pastoral/PastoralVisualWorkspaceV4.tsx
          git commit -m "fix(pastoral): finish image state and layer controls"
          git push origin HEAD:agent/centro-pastoral-reorganizacion
