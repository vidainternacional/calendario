name: Habilitar Hageo en extractor TAHOT

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/stepbible/enable_haggai_extractor.py"
      - ".github/workflows/enable-haggai-extractor.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Habilitar Hageo
        run: |
          python scripts/stepbible/enable_haggai_extractor.py
          python scripts/stepbible/extract_ot_book.py --self-test
      - name: Versionar cambio
        run: |
          if git diff --quiet -- scripts/stepbible/extract_ot_book.py; then
            echo "Sin cambios pendientes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/stepbible/extract_ot_book.py
          git commit -m "feat(fase-d): habilitar Hageo en extractor TAHOT"
          git push
