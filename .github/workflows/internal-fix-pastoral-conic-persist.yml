name: Fix pastoral conic persistence

on:
  push:
    branches:
      - automation/pastoral-conic-persist

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/centro-pastoral-reorganizacion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fetch patch script
        run: git show origin/automation/pastoral-conic-persist:scripts/internal-fix-pastoral-conic-persist.py > /tmp/fix.py
      - name: Apply patch
        run: python /tmp/fix.py
      - name: Generate ephemeral VAPID keys
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const webpush = require('web-push')
          const keys = webpush.generateVAPIDKeys()
          fs.appendFileSync(process.env.GITHUB_ENV, `VAPID_SUBJECT=mailto:ci@example.invalid\n`)
          fs.appendFileSync(process.env.GITHUB_ENV, `NEXT_PUBLIC_VAPID_PUBLIC_KEY=${keys.publicKey}\n`)
          fs.appendFileSync(process.env.GITHUB_ENV, `VAPID_PRIVATE_KEY=${keys.privateKey}\n`)
          NODE
      - run: git diff --check
      - name: Build
        run: npm run build
        env:
          CI: 'true'
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/pastoral/pastoral-canvas-model.ts
          git diff --cached --check
          git commit -m "fix(pastoral): persist conic gradients"
          git push origin HEAD:agent/centro-pastoral-reorganizacion
