name: Registrar política de afijos de Hageo

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/stepbible/register_haggai_affix_policy_master.py"
      - ".github/workflows/register-haggai-affix-policy-master.yml"
      - "docs/FASE_D_POLITICA_AFIJOS_HAGEO.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-master:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Actualizar documento maestro
        run: python scripts/stepbible/register_haggai_affix_policy_master.py
      - name: Versionar actualización
        run: |
          if git diff --quiet -- __VIDA_INTERNACIONAL.md; then
            echo "Sin cambios pendientes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add __VIDA_INTERNACIONAL.md
          git commit -m "docs(fase-d): registrar política de afijos de Hageo"
          git push
