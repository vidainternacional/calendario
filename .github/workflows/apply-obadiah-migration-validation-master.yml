name: Aplicar hito de migración validada de Obadías

on:
  push:
    branches:
      - docs/fase-d-obadias-migracion-validada
    paths:
      - ".github/workflows/apply-obadiah-migration-validation-master.yml"
      - "scripts/stepbible/apply_obadiah_migration_validation_master.py"

permissions:
  contents: write

jobs:
  update-master:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/fase-d-obadias-migracion-validada
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Actualizar documento maestro
        run: |
          python scripts/stepbible/apply_obadiah_migration_validation_master.py
          git diff --check
      - name: Versionar actualización
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "vida-internacional-bot"
          git config user.email "actions@users.noreply.github.com"
          git add __VIDA_INTERNACIONAL.md
          git commit -m "docs(fase-d): registrar migración validada de Obadías"
          git push origin HEAD:docs/fase-d-obadias-migracion-validada
