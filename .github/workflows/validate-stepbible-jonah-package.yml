name: Validar paquete TAHOT de Jonás

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/stepbible/extract_ot_book.py"
      - "scripts/stepbible/audit_jonah_package.py"
      - ".github/workflows/validate-stepbible-jonah-package.yml"
      - "docs/FASE_D_PAQUETE_TAHOT_JONAS.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar auto-tests
        run: |
          python scripts/stepbible/tahot_schema.py --self-test
          python scripts/stepbible/extract_ot_book.py --self-test
          python scripts/stepbible/audit_jonah_package.py --self-test

      - name: Generar paquete A
        run: |
          python scripts/stepbible/extract_ot_book.py \
            --book Jon \
            --output artifacts/jonah-a

      - name: Generar paquete B
        run: |
          python scripts/stepbible/extract_ot_book.py \
            --book Jon \
            --output artifacts/jonah-b

      - name: Verificar reproducibilidad byte a byte
        run: |
          cmp artifacts/jonah-a/jon.json.gz artifacts/jonah-b/jon.json.gz
          cmp artifacts/jonah-a/manifest.json artifacts/jonah-b/manifest.json
          cmp artifacts/jonah-a/audit.md artifacts/jonah-b/audit.md
          sha256sum artifacts/jonah-a/jon.json.gz | tee artifacts/jonah-a/sha256.txt

      - name: Auditar integridad sin variantes
        run: |
          python scripts/stepbible/audit_jonah_package.py \
            --package artifacts/jonah-a/jon.json.gz \
            --output artifacts/jonah-a
          git diff --check

      - uses: actions/upload-artifact@v4
        with:
          name: stepbible-jonah-package
          path: artifacts/jonah-a/
          if-no-files-found: error
          retention-days: 14
