name: Validar paquete TAHOT de Nahúm

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/stepbible/extract_ot_book.py"
      - "scripts/stepbible/audit_nahum_package.py"
      - "scripts/stepbible/verify_nahum_qere_cases.py"
      - ".github/workflows/validate-stepbible-nahum-package.yml"
      - "docs/FASE_D_PAQUETE_TAHOT_NAHUM.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar auto-tests
        run: |
          python scripts/stepbible/tahot_schema.py --self-test
          python scripts/stepbible/extract_ot_book.py --self-test
          python scripts/stepbible/audit_nahum_package.py --self-test
          python scripts/stepbible/verify_nahum_qere_cases.py --self-test

      - name: Generar paquete A
        run: |
          python scripts/stepbible/extract_ot_book.py \
            --book Nam \
            --output artifacts/nahum-a

      - name: Generar paquete B
        run: |
          python scripts/stepbible/extract_ot_book.py \
            --book Nam \
            --output artifacts/nahum-b

      - name: Verificar reproducibilidad byte a byte
        run: |
          cmp artifacts/nahum-a/nam.json.gz artifacts/nahum-b/nam.json.gz
          cmp artifacts/nahum-a/manifest.json artifacts/nahum-b/manifest.json
          cmp artifacts/nahum-a/audit.md artifacts/nahum-b/audit.md
          test "$(stat -c%s artifacts/nahum-a/nam.json.gz)" = "110590"
          test "$(sha256sum artifacts/nahum-a/nam.json.gz | cut -d' ' -f1)" = \
            "60e280a6d94abc8788b7cc9647e4dfa0f679e0a9708a1adf00be30abfc23b7f5"
          sha256sum artifacts/nahum-a/nam.json.gz | tee artifacts/nahum-a/sha256.txt

      - name: Auditar variantes y Qere
        run: |
          python scripts/stepbible/audit_nahum_package.py \
            --package artifacts/nahum-a/nam.json.gz \
            --output artifacts/nahum-a
          python scripts/stepbible/verify_nahum_qere_cases.py \
            --package artifacts/nahum-a/nam.json.gz \
            --output artifacts/nahum-a/nahum-exact-qere.json
          git diff --check

      - uses: actions/upload-artifact@v4
        with:
          name: stepbible-nahum-package
          path: artifacts/nahum-a/
          if-no-files-found: error
          retention-days: 14
