name: Materializar importador Roma temporal

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/fase_d/register_rome_importer_master.py

permissions:
  contents: write

jobs:
  materializar:
    if: github.head_ref == 'agent/fase-d-registrar-importador-roma-final'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Actualizar documento maestro
        run: python3 scripts/fase_d/register_rome_importer_master.py
      - name: Retirar auxiliares y publicar rama final
        run: |
          rm scripts/fase_d/register_rome_importer_master.py
          rm .github/workflows/materializar-importador-roma.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add __VIDA_INTERNACIONAL.md scripts/fase_d/register_rome_importer_master.py .github/workflows/materializar-importador-roma.yml
          git commit -m "docs(fase-d): registrar importador candidato de Roma"
          git push origin HEAD:${{ github.head_ref }}
