name: Materializar preaplicación Roma temporal

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - scripts/fase_d/register_rome_preapplication_master.py

permissions:
  contents: write

jobs:
  materializar:
    if: github.head_ref == 'agent/fase-d-registrar-preaplicacion-roma-final'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fase-d-registrar-preaplicacion-roma-final
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Actualizar documento maestro
        run: python3 scripts/fase_d/register_rome_preapplication_master.py
      - name: Confirmar registro único
        run: test "$(grep -c '936f1a1b1f06e4b3db7aca13e3e909e7c6c6aee6' __VIDA_INTERNACIONAL.md)" -eq 1
      - name: Retirar auxiliares y publicar rama final
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add __VIDA_INTERNACIONAL.md
          git rm scripts/fase_d/register_rome_preapplication_master.py
          git rm .github/workflows/materializar-preaplicacion-roma-temporal.yml
          git diff --cached --check
          git commit -m 'docs(fase-d): registrar preaplicación de Roma'
          git push
