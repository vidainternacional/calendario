name: Materializar aprobación editorial de Roma

on:
  push:
    branches:
      - agent/fase-d-registrar-aprobacion-roma

permissions:
  contents: write

jobs:
  materializar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fase-d-registrar-aprobacion-roma
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Registrar hito y retirar auxiliar
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('__VIDA_INTERNACIONAL.md')
          text = path.read_text(encoding='utf-8').rstrip() + '\n'
          marker = '### Avance confirmado del Bloque 5 — publicación controlada de Roma validada'
          if marker not in text:
              text += '''\n### Avance confirmado del Bloque 5 — publicación controlada de Roma validada\n\nLa revisión editorial del paquete `rome-pilot-v1` fue aprobada por el usuario sin cambios el 2026-08-03. El candidato para aprobar y habilitar exactamente las seis filas fijadas fue validado en PostgreSQL 17 y permanece fuera de migraciones activas.\n\nEvidencia:\n\n- PR #158 y commit de fusión `3c0971d304e273311f6d9963233aa1fe8450e7a6`;\n- PR #159 y commit de fusión `ef8d4fce80f7973bb10da90f094aab710d29dc3c`;\n- PR #160 y commit de fusión `0aea9d6b56fb7c6df3d654ee7399df352dcaf1c1`;\n- `docs/FASE_D_BLOQUE_5_REVISION_EDITORIAL_ROMA.md`;\n- `docs/FASE_D_BLOQUE_5_APROBACION_EDITORIAL_ROMA.md`;\n- candidatos de publicación y recuperación aislados fuera de `supabase/migrations`.\n\nLas seis filas siguen `pending` y deshabilitadas en producción. No se conectó la interfaz y no se avanzó al Bloque 6.\n\n**Siguiente punto autorizado:** preparar una migración activa revisable para aprobar y habilitar exclusivamente las seis filas fijadas de `rome-pilot-v1`, junto con una recuperación operativa equivalente. No aplicar la migración a Supabase, no conectar la interfaz y no avanzar al Bloque 6 hasta completar CI, preflight de producción y una autorización explícita posterior. Las instrucciones anteriores del Bloque 5 quedan subordinadas a este estado más reciente.\n'''
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/materializar-aprobacion-roma.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add __VIDA_INTERNACIONAL.md .github/workflows/materializar-aprobacion-roma.yml
          git commit -m "docs(fase-d): registrar aprobación editorial de Roma"
          git push origin HEAD:agent/fase-d-registrar-aprobacion-roma
