name: Validar tipos de visualización textual

on:
  pull_request:
    branches:
      - main
    paths:
      - "components/estudios/TextualEvidencePanel.tsx"
      - "components/biblia/BibleTextualStudyPanel.tsx"
      - "components/estudios/EstudioProfundoClient.tsx"
      - "components/biblia/BibliaClient.tsx"
      - "lib/estudios/biblical-textual-study.ts"
      - "lib/estudios/resolved-biblical-textual-study.ts"
      - "app/actions/estudio-interno.ts"
      - "app/actions/evidencia-textual.ts"
      - ".github/workflows/validate-general-textual-ui.yml"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Comprobar TypeScript
        run: npx tsc --noEmit
